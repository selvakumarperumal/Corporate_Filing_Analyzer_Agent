# Optional: the model host, inside the cluster.
#
# NOT in kustomization.yaml. The default is Ollama on your machine, reached at
# host.minikube.internal — the same arrangement docker-compose.yml uses, and
# the better one on a laptop, because the host can use the GPU and a pod in
# minikube generally cannot.
#
# Apply this only if you want the stack self-contained:
#
#     kubectl apply -n cfa -f ollama.yaml
#     kubectl -n cfa set env deploy/cfa-backend OLLAMA_BASE_URL=http://ollama:11434
#     # …then pull the models into the pod, which will take a while:
#     kubectl -n cfa exec deploy/ollama -- ollama pull llama3.1:latest
#     kubectl -n cfa exec deploy/ollama -- ollama pull nomic-embed-text:latest
#
# Sizing warning: llama3.1:8b is roughly 5 GB on disk and wants several GB of
# RAM to run, on CPU, slowly. `minikube start --memory 12g --cpus 6` is a
# realistic floor, and answers will still take minutes.
#
# This is also the piece docs/SCALING.md §14 is about: every API pod you add
# queues against this one deployment. Scale it before scaling the API.
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: corporate-filing-analyzer
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  labels:
    app.kubernetes.io/part-of: corporate-filing-analyzer
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Two models, with room to try a third before this becomes a problem.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: corporate-filing-analyzer
spec:
  replicas: 1
  # One writer on the model directory, and no second copy of an 8B model
  # loading into memory beside the first during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: corporate-filing-analyzer
    spec:
      # No legacy Docker-links variables; every setting comes from cfa-config.
      enableServiceLinks: false
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            # Keep the model resident between questions; otherwise the first
            # token of every answer waits for a reload from disk.
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { cpu: "6", memory: 10Gi }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
