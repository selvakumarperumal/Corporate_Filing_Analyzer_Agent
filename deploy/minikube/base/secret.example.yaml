# The two secrets the stack cannot start without, as a file.
#
# The README's preferred route is the one-liner that generates the JWT key at
# apply time, so a real key never touches the disk. Use this file instead if
# you would rather keep the whole deployment declarative:
#
#     cp deploy/minikube/base/secret.example.yaml deploy/minikube/secret.yaml
#     # fill in jwt-secret, then:
#     kubectl apply -f deploy/minikube/secret.yaml
#
# That path is gitignored. This example is not — keep it placeholder-only.
apiVersion: v1
kind: Secret
metadata:
  name: cfa-secrets
  namespace: cfa
type: Opaque
stringData:
  # docs/SCALING.md, Break #1. Unset, each pod invents its own key, and a
  # token minted by one is rejected by every other — random 401s that look
  # like an auth bug and are a deployment bug. Even at one replica, an unset
  # key signs everybody out on each restart.
  #
  #     python3 -c "import secrets; print(secrets.token_urlsafe(64))"
  jwt-secret: "REPLACE-ME-generate-with-the-command-above"

  # Must agree with POSTGRES_USER / POSTGRES_DB in config.yaml, and with
  # postgres-password below.
  #
  # The +asyncpg driver is not optional: core/config.py refuses a plain
  # postgresql:// URL at startup rather than failing on the first query.
  database-url: "postgresql+asyncpg://analyzer:analyzer@postgres:5432/filing_analyzer"

  # What the Postgres StatefulSet initialises the role with.
  postgres-password: "analyzer"
