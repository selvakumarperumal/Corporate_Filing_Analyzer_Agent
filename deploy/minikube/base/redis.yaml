# The conversation read cache.
#
# Nothing lives only here. Flush it, or delete this file from the
# kustomization, and the app stays correct — every message read just goes to
# Postgres instead. That is why there is no PVC and no `--save`: this is a
# cache, and it is allowed to be empty.
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: corporate-filing-analyzer
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: corporate-filing-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: corporate-filing-analyzer
    spec:
      # No legacy Docker-links variables; every setting comes from cfa-config.
      enableServiceLinks: false
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # The same arguments compose passes: cache semantics on purpose —
          # bounded memory, oldest tails evicted rather than writes refused,
          # and no persistence to a disk nothing reads back.
          args:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "500m", memory: 320Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
