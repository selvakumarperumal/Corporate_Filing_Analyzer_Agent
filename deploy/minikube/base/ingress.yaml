# The way in. Needs the ingress addon:  minikube addons enable ingress
#
# ── Why /api and /socket.io skip the frontend pod ────────────────────────
# Under compose the browser talks only to nginx, which proxies both paths to
# the backend. That is fine for one backend and wrong for several: nginx would
# forward each poll request through the frontend Service to the *backend*
# Service, and kube-proxy picks an endpoint per connection. A polling handshake
# would land on a different pod every request — docs/SCALING.md, Break #3, with
# no cookie anywhere in the path to stop it.
#
# Routing those two prefixes here instead puts the sticky cookie between the
# browser and the backend pod, which is the hop that has to stay pinned. The
# page and the API still share one origin, so nothing becomes cross-origin.
#
# ── Host ─────────────────────────────────────────────────────────────────
# cfa.local, which needs a line in /etc/hosts:
#     echo "$(minikube ip)  cfa.local" | sudo tee -a /etc/hosts
# The same string must appear in CORS_ORIGINS (config.yaml) or python-socketio
# refuses the handshake with a 400 before any of this matters.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cfa
  labels:
    app.kubernetes.io/part-of: corporate-filing-analyzer
  annotations:
    # ── Stickiness (docs/SCALING.md §10) ─────────────────────────────────
    # With two API replicas this is what keeps a polling handshake on one pod
    # instead of splitting it across both. `persistent` keeps existing clients
    # where they are when the endpoint list changes, rather than rehashing
    # everyone in the middle of a rollout.
    # ── SCALING FIX #3 · sticky handshakes — the one fix no code can make ─────────────
    # Why: docs/SCALING.md Break #3 · Test: docs/TESTING-SCALING.md §6
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "cfa-sticky"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"

    # ── Timeouts ─────────────────────────────────────────────────────────
    # A streamed answer has long quiet stretches, and an upload is embedded
    # synchronously before it responds. The 60s defaults cut both off
    # mid-flight. These mirror what frontend/nginx.conf already does one layer
    # down.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

    # A 10-K PDF is regularly tens of megabytes; the ingress default is 1m and
    # would reject it with a 413 before the request reached the API.
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  rules:
    - host: cfa.local
      http:
        paths:
          # Longest-prefix wins in ingress-nginx, so these two are matched
          # ahead of the catch-all below.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cfa-frontend
                port:
                  number: 8080
