# Logging configuration for the Corporate Filing Analyzer backend.
#
# Handlers are attached to the root logger only; every other entry just sets a
# level and lets records propagate up. That keeps this file easy to read: one
# place defines *where* logs go, the `loggers` block defines *how much* each
# part of the app says.
#
# Log files land in `backend/logs/` (created automatically on startup).

version: 1
disable_existing_loggers: false

formatters:
  # Console: short and scannable while the server is running.
  console:
    format: "%(asctime)s | %(levelname)-8s | %(name)-31s | %(message)s"
    datefmt: "%H:%M:%S"

  # Files: full detail, including where the line came from.
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(funcName)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: console
    level: INFO
    stream: ext://sys.stdout

  # Everything, including DEBUG, for after-the-fact debugging.
  app_file:
    class: logging.handlers.RotatingFileHandler
    formatter: detailed
    level: DEBUG
    filename: logs/analyzer.log
    maxBytes: 5242880 # 5 MB
    backupCount: 5
    encoding: utf-8

  # Failures only, so problems are not buried in the main log.
  error_file:
    class: logging.handlers.RotatingFileHandler
    formatter: detailed
    level: ERROR
    filename: logs/errors.log
    maxBytes: 2097152 # 2 MB
    backupCount: 3
    encoding: utf-8

loggers:
  # ── Our code: verbose, so every run can be traced end to end ──────────
  #
  # One entry per top-level package, and the level applies to everything
  # under it — `analysis` covers `analysis.graph.nodes`,
  # `analysis.retrieval.vector_store` and the rest. Add a deeper name here
  # only to say something different about one module.
  main: # startup and app assembly
    level: DEBUG
  container: # the process-wide services, built once
    level: DEBUG
  api: # HTTP routes, dependencies, Socket.IO connections and queries
    level: DEBUG
  auth: # signup, login, refresh rotation, token verification
    level: DEBUG
  conversations: # the ledger, the context slice, the Redis tail cache
    level: DEBUG
  analysis: # retrieval, routing, the graph hops, the LLM calls
    level: DEBUG
  db: # engine and schema creation
    level: DEBUG
  core: # settings and paths
    level: INFO

  # ── Third-party noise: keep it out of the console ─────────────────────
  httpx:
    level: WARNING
  httpcore:
    level: WARNING
  urllib3:
    level: WARNING
  chromadb:
    level: WARNING
  langchain:
    level: WARNING
  langchain_core:
    level: WARNING
  langgraph:
    level: WARNING
  socketio:
    level: WARNING
  engineio:
    level: WARNING
  uvicorn.access:
    level: WARNING

root:
  level: INFO
  handlers: [console, app_file, error_file]
