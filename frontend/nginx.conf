# Serves the static workbench and puts the API on the same origin as the page.
#
# Proxying /api and /socket.io here rather than pointing the browser straight at
# the backend is what removes CORS from the picture entirely: to the browser
# there is one origin, so the preflight, the credentials rules and the
# Socket.IO handshake all stop being cross-origin problems.

server {
    # 8080, not 80: the image runs as an unprivileged user, which cannot bind
    # a port below 1024.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Filings are the whole point of the app and a 10-K PDF is regularly tens
    # of megabytes. nginx defaults to 1m, which would reject them with a 413
    # before the request ever reached the backend.
    client_max_body_size 64m;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # ── The API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An upload is embedded synchronously before it answers, and embedding a
        # long filing on a local model is not fast. The default 60s read timeout
        # would abandon a request that is still working.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    # ── Socket.IO ────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # The websocket upgrade. Without these two the transport silently falls
        # back to long-polling, and every answer arrives in stutters.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A long answer streams token by token with quiet stretches in between;
        # a short read timeout would cut the connection mid-answer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── Static assets ────────────────────────────────────────────────────
    # The vendored libraries and the fingerprint-free app files: revalidate
    # rather than cache hard, so a redeploy is picked up without a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
